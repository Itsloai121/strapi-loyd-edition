services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a tested pinned PostgreSQL image or digest}
    restart: always
    volumes:
      - pgdata_test:/var/lib/postgresql
    environment:
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
      POSTGRES_DB: strapi_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${DATABASE_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'

  mysql:
    image: ${MYSQL_IMAGE:?Set a tested pinned MySQL image or digest}
    restart: always
    environment:
      MYSQL_DATABASE: strapi_test
      MYSQL_USER: strapi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a unique database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a unique database password}
    volumes:
      - mysqldata_test:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping']
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - '${DATABASE_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306'

volumes:
  pgdata_test:
  mysqldata_test:
